# Herdr writes this key itself, so chezmoi has to own it or they fight.
onboarding = false

# Herdr keymap: preserve the direct Option-key workflow from the old Zellij
# config, with the tmux-shaped prefix bindings retained as fallbacks.

[keys]
prefix = "ctrl+a"

# Session/workspace navigation. Alt+s opens the session navigator, the surface
# closest to the Zellij session-manager it used to open floating; the narrower
# workspace picker keeps the prefix binding.
detach = ["alt+q", "prefix+d", "prefix+q"]
goto = ["alt+s", "prefix+w", "prefix+g"]
workspace_picker = "prefix+s"
settings = "prefix+shift+s"

# Stepping between workspaces is unbound in Herdr's defaults, not just unset
# here, so without these the picker is the only way across. Vertical axis
# matches the sidebar list direction and Herdr's own navigate_workspace_up/down;
# against alt+shift's agent stepping the heavier modifier reads as the coarser
# jump on the same axis. Cmd is listed first for the macOS-native reach; ctrl+alt
# stays as the portable fallback, since cmd does not survive `herdr --remote` to a
# Linux server. Ghostty's cmd+alt+arrow_up/down=goto_split is unbound in its config
# so these reach Herdr at all.
previous_workspace = ["cmd+alt+up", "ctrl+alt+up"]
next_workspace = ["cmd+alt+down", "ctrl+alt+down"]

# Tabs. These direct bindings match the old Zellij shared keymap.
new_tab = ["alt+t", "prefix+c"]
rename_tab = ["alt+shift+t", "prefix+comma", "prefix+shift+t"]
previous_tab = ["alt+shift+left", "prefix+p"]
next_tab = ["alt+shift+right", "prefix+n"]
move_tab_previous = "alt+i"
move_tab_next = "alt+o"
switch_tab = ["alt+1..9", "prefix+1..9"]
close_tab = ["prefix+ampersand", "prefix+shift+x"]

# Agents. Vertical axis mirrors the tabs' alt+shift+left/right, matching the
# sidebar list direction and staying clear of the unshifted alt+arrow nvim nav.
previous_agent = ["alt+shift+up", "prefix+["]
next_agent = ["alt+shift+down", "prefix+]"]
focus_agent = "prefix+alt+1..9"

# Panes. Cmd+d/cmd+shift+d carry Ghostty's split rule — one letter, shift picks
# the axis — so they lead; the Zellij-inherited alt+n/alt+shift+d stay as aliases
# despite encoding no such rule. Ghostty's super+d/super+shift+d=new_split are
# unbound in its config so these reach Herdr, which owns pane layout here. Herdr
# has no direction-neutral NewPane action, so alt+n splits right like Zellij's
# explicit alt+shift+r.
split_vertical = ["cmd+d", "alt+n", "alt+shift+r", "prefix+shift+backslash"]
split_horizontal = ["cmd+shift+d", "alt+shift+d", "prefix+minus"]
cycle_pane_next = "prefix+o"
last_pane = "prefix+semicolon"
close_pane = ["alt+shift+w", "prefix+x"]
zoom = ["alt+z", "prefix+m", "prefix+z"]
edit_scrollback = ["alt+e", "prefix+e"]

# Match tmux's prefix+arrow resizing. Herdr's resize mode remains available on
# Shift-r for longer adjustments.
resize_pane_left = "prefix+left"
resize_pane_down = "prefix+down"
resize_pane_up = "prefix+up"
resize_pane_right = "prefix+right"
resize_mode = "prefix+shift+r"
reload_config = "prefix+r"

# Seamless pane navigation. The Herdr plugin forwards these chords into Neovim
# while an inner split is available, then crosses the pane boundary at an edge.
[[keys.command]]
key = "alt+left"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "navigate left across Neovim and Herdr"

[[keys.command]]
key = "alt+down"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "navigate down across Neovim and Herdr"

[[keys.command]]
key = "alt+up"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "navigate up across Neovim and Herdr"

[[keys.command]]
key = "alt+right"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "navigate right across Neovim and Herdr"

# The old Zellij sessionizer binding creates or focuses Herdr workspaces.
[[keys.command]]
key = "alt+shift+s"
type = "popup"
command = "\"$HOME/bin/herdr-sessionizer\""
description = "project workspace picker"
width = "80%"
height = "60%"

# Keep the former tmux sessionizer binding as a fallback.
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "\"$HOME/bin/herdr-sessionizer\""
description = "project workspace picker"
width = "80%"
height = "60%"

[[keys.command]]
key = "prefix+ctrl+d"
type = "popup"
command = "\"$HOME/bin/herdr-sessionizer\" \"$HOME/.local/share/chezmoi/home\""
description = "open dotfiles workspace"
width = "80%"
height = "60%"

[[keys.command]]
key = "prefix+ctrl+n"
type = "popup"
command = "\"$HOME/bin/herdr-sessionizer\" \"$HOME/.config/nvim\""
description = "open Neovim workspace"
width = "80%"
height = "60%"

[[keys.command]]
key = "prefix+ctrl+w"
type = "popup"
command = "\"$HOME/bin/herdr-sessionizer\" \"$HOME/work\""
description = "open work workspace"
width = "80%"
height = "60%"

[[keys.command]]
key = "prefix+ctrl+p"
type = "popup"
command = "\"$HOME/bin/herdr-sessionizer\" \"$HOME/personal\""
description = "open personal workspace"
width = "80%"
height = "60%"

[[keys.command]]
key = "prefix+ctrl+s"
type = "popup"
command = "\"$HOME/bin/herdr-sessionizer\" \"$HOME/personal/ssh\""
description = "open SSH workspace"
width = "80%"
height = "60%"

[ui]
sidebar_collapsed_mode ="hidden"
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true

# tmux/zellij-style splitting: one shared line between panes, no frame around the
# outside. pane_borders stays on — the shared divider is drawn from it, and the
# agent labels below ride on it.
pane_outer_borders = false
pane_gaps = false

# The agent row was a constant "claude" on every entry. Claude Code publishes a
# summary of what it is working on as its OSC terminal title, which Herdr tracks
# per pane, so spend that row on the topic instead. It falls back to the agent's
# own idle title ("Claude Code") before a topic exists, so the row never empties.
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
]

# Herdr draws tab bar entries in the active theme's colors; they carry no styling.
[[ui.tab_bar_right]]
type = "zoom"

[[ui.tab_bar_right]]
type = "datetime"
format = "%H:%M"
