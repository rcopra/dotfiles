# Terminal, history, and window numbering
set -g default-terminal "tmux-256color"
# extkeys = Ghostty supports modifyOtherKeys; tmux needs it to negotiate extended keys.
set -as terminal-features ",xterm-ghostty:RGB:clipboard:extkeys"
# With extended keys (tmux 3.5+), Shift+Alt+<letter> arrives as M-S-<UPPER>
# (eg M-S-W) instead of M-W, so those chords are bound in both forms below.
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S: #W"
set -g focus-events on
set -sg escape-time 0

# Prefix and panes
set -g prefix C-a
unbind C-b
bind C-a send-prefix
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -n M-n split-window -h -c "#{pane_current_path}"
bind -n M-R split-window -h -c "#{pane_current_path}"
bind -n M-S-R split-window -h -c "#{pane_current_path}"
bind -n M-D split-window -v -c "#{pane_current_path}"
bind -n M-S-D split-window -v -c "#{pane_current_path}"
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5
bind m resize-pane -Z
bind -n M-z resize-pane -Z
bind -n M-W confirm-before -p "Kill pane? (y/n)" kill-pane
bind -n M-S-W confirm-before -p "Kill pane? (y/n)" kill-pane
bind r source-file ~/.tmux.conf

# Alt+arrows cross Neovim splits and tmux panes via smart-splits.nvim.
bind -n M-Left if -F "#{@pane-is-vim}" "send-keys M-Left" "select-pane -L"
bind -n M-Down if -F "#{@pane-is-vim}" "send-keys M-Down" "select-pane -D"
bind -n M-Up if -F "#{@pane-is-vim}" "send-keys M-Up" "select-pane -U"
bind -n M-Right if -F "#{@pane-is-vim}" "send-keys M-Right" "select-pane -R"

# Windows (tabs)
bind c new-window -c "#{pane_current_path}"
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-T command-prompt -I "#W" "rename-window -- '%%'"
bind -n M-S-T command-prompt -I "#W" "rename-window -- '%%'"
bind -n M-S-Left previous-window
bind -n M-S-Right next-window
bind -n M-i swap-window -t :-1
bind -n M-o swap-window -t :+1
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind J choose-window "join-pane -s '%%'"
bind S choose-window "join-pane -t '%%'"
bind W choose-window "swap-window -t '%%'"

# Sessions and project picker
bind -n M-q detach-client
bind q detach-client
bind -n M-s choose-tree -Zw
bind s choose-tree -Zs
bind -n C-M-Up switch-client -p
bind -n C-M-Down switch-client -n
bind f display-popup -E -w 80% -h 60% -d "#{pane_current_path}" '"$HOME/bin/tmux-sessionizer"'
bind -n M-S display-popup -E -w 80% -h 60% -d "#{pane_current_path}" '"$HOME/bin/tmux-sessionizer"'
bind -n M-S-S display-popup -E -w 80% -h 60% -d "#{pane_current_path}" '"$HOME/bin/tmux-sessionizer"'
bind C-d run-shell '"$HOME/bin/tmux-sessionizer" "$HOME/.local/share/chezmoi/home"'
bind C-n run-shell '"$HOME/bin/tmux-sessionizer" "$HOME/.config/nvim"'
bind C-w run-shell '"$HOME/bin/tmux-sessionizer" "$HOME/work"'
bind C-p run-shell '"$HOME/bin/tmux-sessionizer" "$HOME/personal"'

# Mouse and clipboard (OSC 52 also works through SSH)
set -g mouse on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode-vi S-Up send -X scroll-up
bind -T copy-mode-vi S-Down send -X scroll-down
bind -n MouseDown1Pane select-pane -t = \; send-keys -M
set -g set-clipboard on
set -g allow-passthrough on

# Catppuccin Mocha status bar (official plugin, pinned to v2.3.0).
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_flags "icon"
# Powerline boxes, gruvbox-style: each box ends in a filled arrow of its own
# colour on the bar, and the next box carves a bar-coloured slot out of its
# background, so the arrow nests into the open slot.
setw -g window-status-separator ""
set -g @catppuccin_window_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_left_separator "#[fg=#{@_ctp_status_bg}] "
set -g @catppuccin_window_middle_separator "#[fg=#{@catppuccin_window_number_color},bg=#{@catppuccin_window_text_color}]"
set -g @catppuccin_window_right_separator "#[fg=#{@catppuccin_window_text_color},bg=#{@_ctp_status_bg}]"
set -g @catppuccin_window_current_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_current_left_separator "#[fg=#{@_ctp_status_bg}] "
set -g @catppuccin_window_current_middle_separator "#[fg=#{@catppuccin_window_current_number_color},bg=#{@catppuccin_window_current_text_color}]"
set -g @catppuccin_window_current_right_separator "#[fg=#{@catppuccin_window_current_text_color},bg=#{@_ctp_status_bg}]"
# Flat powerline separators instead of rounded pills.
set -g @catppuccin_status_connect_separator "yes"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator " "
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-position bottom
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
# Session box, hand-built so its left edge is flat against the bar (the
# left cap is only right for boxes that follow another box).
set -g status-left "#[fg=#{@thm_crust},bg=#{E:@catppuccin_session_color}]#{@catppuccin_session_icon}#[fg=#{E:@thm_fg},bg=#{@thm_surface_0}]#{E:@catppuccin_session_text} #[fg=#{@thm_surface_0},bg=#{@_ctp_status_bg}]"
set -gF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

# tmux-cpu / tmux-battery provide #{cpu_percentage}, #{ram_percentage}, #{battery_*}.
run ~/.tmux/plugins/tmux-cpu/cpu.tmux
run ~/.tmux/plugins/tmux-battery/battery.tmux

# Server options; extkeys needs the terminal feature above and a fresh client.
set -s extended-keys on
set -s extended-keys-format csi-u
