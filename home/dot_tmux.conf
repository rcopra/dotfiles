# Terminal, history, and window numbering
set -g default-terminal "tmux-256color"
# extkeys = Ghostty supports modifyOtherKeys; tmux needs it to negotiate extended keys.
set -as terminal-features ",xterm-ghostty:RGB:clipboard:extkeys"
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S: #W"
set -g focus-events on
set -sg escape-time 0

# Prefix and panes
set -g prefix C-a
unbind C-b
bind C-a send-prefix
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -n M-n split-window -h -c "#{pane_current_path}"
bind -n M-R split-window -h -c "#{pane_current_path}"
bind -n M-D split-window -v -c "#{pane_current_path}"
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5
bind m resize-pane -Z
bind -n M-z resize-pane -Z
bind -n M-W confirm-before -p "Kill pane? (y/n)" kill-pane
bind r source-file ~/.tmux.conf

# Alt+arrows cross Neovim splits and tmux panes via smart-splits.nvim.
bind -n M-Left if -F "#{@pane-is-vim}" "send-keys M-Left" "select-pane -L"
bind -n M-Down if -F "#{@pane-is-vim}" "send-keys M-Down" "select-pane -D"
bind -n M-Up if -F "#{@pane-is-vim}" "send-keys M-Up" "select-pane -U"
bind -n M-Right if -F "#{@pane-is-vim}" "send-keys M-Right" "select-pane -R"

# Windows (tabs)
bind c new-window -c "#{pane_current_path}"
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-T command-prompt -I "#W" "rename-window -- '%%'"
bind -n M-S-Left previous-window
bind -n M-S-Right next-window
bind -n M-i swap-window -t :-1
bind -n M-o swap-window -t :+1
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind J choose-window "join-pane -s '%%'"
bind S choose-window "join-pane -t '%%'"
bind W choose-window "swap-window -t '%%'"

# Sessions and project picker
bind -n M-q detach-client
bind q detach-client
bind -n M-s choose-tree -Zw
bind s choose-tree -Zs
bind -n C-M-Up switch-client -p
bind -n C-M-Down switch-client -n
bind f display-popup -E -w 80% -h 60% -d "#{pane_current_path}" '"$HOME/bin/tmux-sessionizer"'
bind -n M-S display-popup -E -w 80% -h 60% -d "#{pane_current_path}" '"$HOME/bin/tmux-sessionizer"'
bind C-d run-shell '"$HOME/bin/tmux-sessionizer" "$HOME/.local/share/chezmoi/home"'
bind C-n run-shell '"$HOME/bin/tmux-sessionizer" "$HOME/.config/nvim"'
bind C-w run-shell '"$HOME/bin/tmux-sessionizer" "$HOME/work"'
bind C-p run-shell '"$HOME/bin/tmux-sessionizer" "$HOME/personal"'

# Mouse and clipboard (OSC 52 also works through SSH)
set -g mouse on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode-vi S-Up send -X scroll-up
bind -T copy-mode-vi S-Down send -X scroll-down
bind -n MouseDown1Pane select-pane -t = \; send-keys -M
set -g set-clipboard on
set -g allow-passthrough on

# Catppuccin Mocha status bar (official plugin, pinned to v2.3.0).
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_flags "icon"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_date_time}"

# Server option; needs the extkeys terminal feature above to take effect.
set -s extended-keys on
