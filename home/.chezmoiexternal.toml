# vim-zellij-navigator: per-keypress nvim detection for seamless Alt+arrow
# pane nav (replaces the old zellij-autolock approach)
[".config/zellij/plugins/vim-zellij-navigator.wasm"]
    type = "file"
    url = "https://github.com/hiasr/vim-zellij-navigator/releases/download/0.3.0/vim-zellij-navigator.wasm"
    refreshPeriod = "672h"
